<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PromptPay QR · สร้างคิวอาร์โอนเงินตามยอด</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b0418;--card:rgba(30,12,60,.62);--line:rgba(190,140,255,.35);--tx:#f5eeff;--mut:#b9a3e6;--p1:#a855f7;--p2:#7c3aed;--p3:#e879f9;--p4:#6366f1}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#2a0d5c 0,transparent 50%),radial-gradient(circle at 90% 100%,#4a0d6e 0,transparent 50%),var(--bg);color:var(--tx);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.45;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.b1{width:380px;height:380px;background:#7c3aed;top:-80px;left:-80px}
.b2{width:340px;height:340px;background:#d946ef;bottom:-60px;right:-60px;animation-delay:-5s}
.b3{width:260px;height:260px;background:#4f46e5;top:45%;left:55%;animation-delay:-9s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.25)}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 16px 40px}
.banner{position:relative;border-radius:24px;padding:26px 18px 22px;text-align:center;overflow:hidden;border:1px solid var(--line);background:linear-gradient(120deg,#3b0a7a,#7c3aed,#c026d3,#7c3aed,#3b0a7a);background-size:300% 100%;animation:flow 8s linear infinite;box-shadow:0 0 40px rgba(168,85,247,.6),inset 0 0 40px rgba(255,255,255,.12)}
@keyframes flow{to{background-position:300% 0}}
.banner::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
@keyframes shine{to{left:130%}}
.logo{width:92px;height:92px;margin:0 auto 6px;animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 0 14px #f0abfc)}
@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
.logo .ring{transform-origin:50% 50%;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#fff,#f5d0fe,#c4b5fd,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 5s linear infinite;text-shadow:0 0 30px rgba(255,255,255,.3)}
.tag{margin:6px 0 0;color:#ede4ff;font-size:14px;opacity:.95}
.card{margin-top:18px;border-radius:24px;padding:20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 50px rgba(124,58,237,.35)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(10,3,28,.65);color:var(--tx);font:inherit;font-size:16px;outline:none;transition:.25s}
input:focus{border-color:var(--p3);box-shadow:0 0 0 3px rgba(232,121,249,.3),0 0 22px rgba(168,85,247,.5)}
.amt{font-size:30px;font-weight:800;text-align:center;letter-spacing:1px;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.chip{border:1px solid var(--line);background:rgba(168,85,247,.16);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;transition:.2s}
.chip:hover{background:var(--p2);transform:translateY(-2px) scale(1.06);box-shadow:0 0 16px var(--p1)}
.go{position:relative;width:100%;margin-top:18px;padding:15px;border:0;border-radius:16px;font:inherit;font-size:18px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,#7c3aed,#c026d3,#6366f1,#7c3aed);background-size:300% 100%;animation:flow 4s linear infinite;box-shadow:0 0 26px rgba(192,38,211,.7);overflow:hidden;transition:transform .15s}
.go:hover{transform:scale(1.02)}.go:active{transform:scale(.97)}
.err{color:#fda4af;font-size:13px;text-align:center;min-height:18px;margin-top:8px}
#out{display:none;margin-top:18px;text-align:center}
#out.show{display:block;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
.qrbox{position:relative;width:min(300px,100%);margin:0 auto;padding:5px;border-radius:26px;overflow:hidden;box-shadow:0 0 50px rgba(217,70,239,.7)}
.qrbox::before{content:"";position:absolute;inset:-60%;background:conic-gradient(#a855f7,#e879f9,#6366f1,#22d3ee,#a855f7);animation:spin 3s linear infinite}
.qrin{position:relative;background:#fff;border-radius:22px;padding:14px 14px 10px}
.qrin svg{display:block;width:100%;height:auto}
.pp{font-weight:800;color:#3b0a7a;font-size:15px;margin-bottom:6px;letter-spacing:.5px}
.sum{margin-top:14px;font-size:14px;color:var(--mut)}
.big{font-size:38px;font-weight:800;background:linear-gradient(90deg,#fff,#f0abfc,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(217,70,239,.7))}
.row{display:flex;gap:10px;margin-top:14px}
.btn2{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(168,85,247,.2);color:var(--tx);font:inherit;cursor:pointer;transition:.2s}
.btn2:hover{background:var(--p2);box-shadow:0 0 18px var(--p1)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:18px}
 
.banner{padding:0 0 20px}
.hero{display:block;width:100%;height:auto;border-radius:24px 24px 0 0;animation:none}
.banner::before{content:"";position:absolute;left:0;right:0;top:0;aspect-ratio:16/9;background:linear-gradient(180deg,transparent 55%,rgba(59,10,122,.85));z-index:1;pointer-events:none}
.logowrap{position:relative;z-index:2;width:104px;height:104px;margin:-62px auto 8px;border-radius:50%;padding:4px;background:conic-gradient(#fff,#e879f9,#6366f1,#22d3ee,#a855f7,#fff);animation:spin 4s linear infinite;box-shadow:0 0 30px #e879f9}
.logowrap .logo{display:block;width:100%;height:100%;margin:0;border-radius:50%;object-fit:cover;background:#fff;animation:spin 4s linear infinite reverse;filter:none}
.banner h1,.banner .tag{position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){*{animation-duration:30s!important}}
</style>
</head>

    <h1 id="shopTitle">Kaizen Shop by.cheer</h1>
    <p class="tag">✦เช็คยอดเงินและชื่อบัญชีก่อนโอน✦</p>
  </div>
 
  <div class="card">
    <label for="shop">ชื่อบัญชี</label>
    <input id="shop" value="รัตนพร แฉ****" maxlength="28">
    <label for="amt">กรอกยอดที่ต้องโอน (บาท)</label>
    <input id="amt" class="amt" inputmode="decimal" placeholder="0.00">
    <div class="chips" id="chips"></div>
    <button class="go" id="go">⊹ ࣪ ˖ สร้างคิวอาร์โค้ด ˑ ִ ֗ ִ </button>
    <div class="err" id="err"></div>
 
    <div id="out">
      <div class="qrbox"><div class="qrin"><div class="pp">PromptPay · พร้อมเพย์</div><div id="qr"></div></div></div>
      <div class="sum"><span id="oshop"></span><br><span class="big" id="oamt"></span> <span>บาท</span></div>
      <div class="row"><button class="btn2" id="dl">⬇ บันทึกรูป</button></div>
    </div>
  </div>
  <div class="foot">𐔌ﺮ ͜     𓈒 ตรวจสอบชื่อบัญชีและยอดทุกครั้งก่อนกดยืนยันการโอน ֺ  𓏼  ͡ ֪ </div>
</div>
 
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var KEY='ppqr-settings';
 
function syncTitle(){$('shopTitle').textContent=$('shop').value.trim()||'MY SHOP'}
syncTitle();$('shop').addEventListener('input',syncTitle);
 
[20,50,100,199,299,500,1000].forEach(function(v){var b=document.createElement('button');b.className='chip';b.textContent='฿'+v;b.onclick=function(){$('amt').value=v;burst(innerWidth/2,innerHeight/2,18)};$('chips').appendChild(b)});
 
function f(id,val){return id+('0'+val.length).slice(-2)+val}
function crc16(str){var c=0xFFFF;for(var i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(var j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return ('000'+c.toString(16).toUpperCase()).slice(-4)}
function payload(id,amount){
  var t=id.length>=13?'02':'01';
  var v=id.length>=13?id:'0066'+id.slice(1);
  var acc=f('00','A000000677010111')+f(t,v);
  var p=f('00','01')+f('01','12')+f('29',acc)+f('53','764')+f('54',amount)+f('58','TH');
  p+='6304';return p+crc16(p)}
 
var cur=null;
function build(){
  var id=atob('MDk1MDU0MTE1MQ=='),a=parseFloat($('amt').value.replace(/,/g,''));
  var err=$('err');err.textContent='';
  if(id.length!==10&&id.length!==13){err.textContent='กรอกเบอร์โทร 10 หลัก หรือเลขบัตร 13 หลักให้ถูกต้อง';return}
  if(!(a>0)||a>9999999){err.textContent='กรุณากรอกยอดเงินให้ถูกต้อง';return}
  var amount=a.toFixed(2),code=payload(id,amount);
  var q=qrcode(0,'M');q.addData(code);q.make();
  $('qr').innerHTML=q.createSvgTag({cellSize:6,margin:0,scalable:true});
  $('oshop').textContent=$('shop').value.trim();
  $('oamt').textContent=Number(amount).toLocaleString('th-TH',{minimumFractionDigits:2});
  cur={q:q,code:code,amount:amount};
  var o=$('out');o.classList.remove('show');void o.offsetWidth;o.classList.add('show');
  try{localStorage.setItem(KEY,JSON.stringify({shop:$('shop').value}))}catch(e){}
  var r=o.getBoundingClientRect();window.scrollTo({top:scrollY+r.top-20,behavior:'smooth'});
  burst(innerWidth/2,innerHeight/2,90)}
$('go').onclick=build;
$('amt').addEventListener('keydown',function(e){if(e.key==='Enter')build()});
 
$('dl').onclick=function(){
  if(!cur)return;var n=cur.q.getModuleCount(),S=10,m=40,W=n*S+m*2,H=W+150;
  var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#4c1d95');g.addColorStop(1,'#c026d3');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#fff';x.fillRect(m/2,m/2,W-m,W-m+20);
  x.fillStyle='#2e1065';for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(cur.q.isDark(r,k))x.fillRect(m+k*S,m+r*S+10,S,S);
  x.fillStyle='#fff';x.textAlign='center';x.font='700 34px Prompt,sans-serif';x.fillText($('shop').value.trim(),W/2,W+50);
  x.font='800 46px Prompt,sans-serif';x.fillText('฿ '+Number(cur.amount).toLocaleString('th-TH',{minimumFractionDigits:2}),W/2,W+110);
  var a=document.createElement('a');a.download='promptpay-'+cur.amount+'.png';a.href=c.toDataURL('image/png');a.click()};
var cpb=$('cp');if(cpb)cpb.onclick=function(){
  if(!cur)return;var b=$('cp');
  function ok(){b.textContent='✔ คัดลอกแล้ว';setTimeout(function(){b.textContent='⧉ คัดลอกโค้ด'},1500)}
  try{navigator.clipboard.writeText(cur.code).then(ok,ok)}catch(e){ok()}};
 
/* floating background + confetti */
var cv=$('fx'),cx=cv.getContext('2d'),P=[],W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
var cols=['#c084fc','#e879f9','#a78bfa','#818cf8','#f5d0fe','#fff'];
for(var i=0;i<60;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1,vy:-(Math.random()*.6+.15),vx:(Math.random()-.5)*.4,c:cols[i%6],a:Math.random()*6,t:'o',l:1e9});
function burst(x,y,n){for(var i=0;i<n;i++){var an=Math.random()*6.28,sp=Math.random()*9+3;P.push({x:x,y:y,r:Math.random()*4+2,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-4,c:cols[i%6],a:0,t:'c',l:90})}}
function star(x,y,r){cx.beginPath();for(var i=0;i<8;i++){var d=i%2?r*.4:r*1.6,a=i*Math.PI/4;cx.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d)}cx.closePath();cx.fill()}
function tick(){cx.clearRect(0,0,W,H);
  for(var i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.a+=.05;
    if(p.t==='c'){p.vy+=.28;p.vx*=.985;p.l--;if(p.l<=0){P.splice(i,1);continue}cx.globalAlpha=Math.min(1,p.l/40)}
    else{cx.globalAlpha=.4+.5*Math.abs(Math.sin(p.a));if(p.y<-10){p.y=H+10;p.x=Math.random()*W}if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10}
    cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=12;
    if(i%3===0||p.t==='c')star(p.x,p.y,p.r);else{cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill()}}
  cx.globalAlpha=1;requestAnimationFrame(tick)}
tick();
addEventListener('pointerdown',function(e){burst(e.clientX,e.clientY,8)});
})();
</script>
